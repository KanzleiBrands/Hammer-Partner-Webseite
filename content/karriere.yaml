heroTitel: Arbeite da, wo der Mensch zählt.
heroText: >-
  Flache Hierarchien, ein Team, das sich gegenseitig unterstützt, und ein
  „Du" vom Azubi bis zum Chef. Bei Hammer & Partner in Betzdorf arbeitest du
  selbstständig, digital und mit Kolleginnen und Kollegen, auf die du dich
  verlassen kannst.
benefits:
  - titel: Attraktives Gehalt
    text: Faire Bezahlung, die zu deiner Erfahrung und Position passt – transparent von Anfang an.
    icon: euro
  - titel: 13,3 Gehälter
    text: Inklusive Weihnachts- und Urlaubsgeld, dazu eine Prämie.
    icon: gift
  - titel: 30 Tage Urlaub
    text: Genug Zeit zum Abschalten und für das, was dir wichtig ist.
    icon: palm
  - titel: Flexible Arbeitszeiten
    text: Zwischen 20 und 40 Stunden – du gestaltest deine Woche mit.
    icon: clock
  - titel: Homeoffice möglich
    text: Dank digitaler Prozesse arbeitest du auch von zu Hause.
    icon: home
  - titel: e-Bike-Leasing
    text: Gesund und nachhaltig zur Arbeit – wir unterstützen dich dabei.
    icon: bike
  - titel: Firmenwagen möglich
    text: Je nach Position ist auch ein Firmen-PKW drin.
    icon: car
  - titel: Betriebliche Krankenversicherung
    text: Zusätzliche Gesundheitsleistungen, die wir für dich übernehmen.
    icon: heart
  - titel: Weiterbildung
    text: Wir fördern deine Entwicklung – fachlich und persönlich.
    icon: graduation
  - titel: Sicherer Arbeitsplatz
    text: Eine etablierte Kanzlei – gegründet 1965 – mit klarer Zukunft.
    icon: shield
  - titel: Fahrtkostenzuschuss & Edenred-Karte
    text: Extras, die sich jeden Monat bemerkbar machen.
    icon: card
  - titel: Betriebsveranstaltungen
    text: Wir feiern Erfolge gemeinsam – nicht nur zur Weihnachtsfeier.
    icon: party
faq:
  - frage: Brauche ich ein Anschreiben?
    antwort: >-
      Nein. Unsere Kurzbewerbung dauert rund 60 Sekunden. Einen Lebenslauf
      kannst du anhängen, musst du aber nicht – wir lernen dich lieber im
      Gespräch kennen.
  - frage: Kann ich auch in Teilzeit arbeiten?
    antwort: >-
      Ja. Unsere Stellen sind in Voll- und Teilzeit möglich, zwischen 20 und 40
      Stunden pro Woche.
  - frage: Ist Homeoffice möglich?
    antwort: >-
      Ja. Wir arbeiten weitgehend papierlos mit DATEV. Dadurch kannst du auch
      von zu Hause arbeiten.
  - frage: Wo arbeite ich?
    antwort: >-
      In unserer Kanzlei in der Moltkestraße 71 in Betzdorf – gut erreichbar
      aus dem gesamten Kreis Altenkirchen und dem Westerwald.
  - frage: Wie geht es nach meiner Bewerbung weiter?
    antwort: >-
      Wir melden uns persönlich bei dir und vereinbaren ein unverbindliches
      Kennenlernen. Wenn es auf beiden Seiten passt, besprechen wir alles
      Weitere direkt.
  - frage: Unterstützt ihr Weiterbildungen?
    antwort: >-
      Ja, ausdrücklich. Ob Fachkurse, Lohn-Spezialisierung oder die nächste
      Qualifikation – wir fördern deine Entwicklung.
