titel: Betriebswirtschaftliche Beratung
reihenfolge: 4
kurz: >-
  Von der Gründung über das Bankgespräch bis zur Krise: Wir sind Sparringspartner
  für Deine unternehmerischen Entscheidungen.
text: >-
  Zahlen erzählen Geschichten – wir helfen Dir, sie zu lesen. Wir besprechen
  Deine Auswertungen mit Dir, planen Liquidität, bereiten Bankgespräche vor und
  stehen Dir auch in schwierigen Phasen zur Seite. Ehrlich, lösungsorientiert
  und mit Blick auf das Ganze.
