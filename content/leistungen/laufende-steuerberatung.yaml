titel: Laufende Steuerberatung
reihenfolge: 1
kurz: >-
  Buchhaltung, Jahresabschluss und Steuererklärungen – zuverlässig, pünktlich
  und so, dass Du jederzeit weißt, wo Du stehst.
text: >-
  Die Pflicht erledigen wir mit Anspruch: Wir übernehmen Deine laufende
  Buchhaltung, erstellen Jahresabschlüsse und Steuererklärungen und halten Dir
  den Rücken gegenüber dem Finanzamt frei. Du hast Ansprechpartner,
  die Dein Unternehmen kennen.
bild: /images/cms/laufende-steuerberatung/bild.webp
punkte:
  - Finanzbuchhaltung
  - Jahresabschluss & Bilanz
  - Betriebliche Steuererklärungen
  - Private Einkommensteuer
  - Kommunikation mit dem Finanzamt
  - Betriebsprüfungen
