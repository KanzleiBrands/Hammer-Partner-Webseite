titel: Steuerfachangestellter (m/w/d)
aktiv: true
schwerpunkt: Schwerpunkt Lohn
teaser: >-
  Du liebst Lohnabrechnungen, kennst DATEV aus dem Effeff und suchst ein Team,
  in dem man sich duzt und gegenseitig hilft? Dann komm zu uns nach Betzdorf.
bild: /images/cms/steuerfachangestellter-lohn/bild.webp
ort: Betzdorf
anstellung: Vollzeit oder Teilzeit
stunden: 20–40 Std.
gehaltVon: 3500
gehaltBis: 5000
start: ab sofort
veroeffentlicht: 2026-09-29
aufgaben:
  - Du erstellst selbstständig die Lohn- und Gehaltsabrechnungen für unsere Mandanten.
  - Du kümmerst Dich um Meldungen an Finanzamt, Krankenkassen und Sozialversicherungsträger.
  - Du begleitest Lohnsteuer- und Sozialversicherungsprüfungen.
  - Du berätst unsere Mandanten rund um Lohnoptimierung und Nettolohn-Bausteine.
  - Bei Bedarf unterstützt Du auch in der Finanzbuchhaltung.
profil:
  - Abgeschlossene Ausbildung als Steuerfachangestellter (m/w/d) oder vergleichbare Qualifikation
  - Mehrjährige Berufserfahrung, idealerweise im Bereich Lohn
  - Sichere DATEV-Kenntnisse
  - Kommunikationsstärke und Freude am Kontakt mit Mandanten
  - Teamgeist, Hilfsbereitschaft und eine positive Ausstrahlung
ansprechpartner: klapper
