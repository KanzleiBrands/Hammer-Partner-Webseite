introTitel: Am Ende geht es immer um den Menschen dahinter.
introText: >-
  Hinter jeder Steuererklärung, jeder Bilanz und jeder unternehmerischen
  Entscheidung steht ein Mensch mit Plänen, Sorgen und Zielen. Genau da setzen
  wir an: Wir hören zu, denken mit und begleiten dich langfristig – ehrlich,
  transparent und mit echtem Interesse an deinem Erfolg.
