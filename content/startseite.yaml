heroTitel: Steuerberatung, bei der der Mensch im Mittelpunkt steht.
heroText: >-
  Wir denken voraus, arbeiten digital und sprechen Klartext – damit du dich auf
  dein Unternehmen konzentrieren kannst. Persönlich, auf Augenhöhe und per Du.
